[workspace]
resolver = "2"
members = ["elude_core", "elude_macro"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/magicolo/elude"
description = ""

[workspace.dependencies]
arc-swap = "1.9.2"
bumpalo = "3.20.3"
cache_line_size = "1.0.0"
criterion = { version = "0.8", features = ["html_reports"] }
crossbeam-utils = "0.8.22"
parking_lot = "0.12.5"
triomphe = { version = "0.1.16", features = ["arc-swap"] }
thiserror = "2.0.19"

[package]
name = "elude"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[dependencies]
elude_core = { path = "elude_core" }
elude_macro = { path = "elude_macro" }
